# Voice slot metadata.
# Voice ids belong in .env, so the provider voice id for each
# slot lives in .env (VOICE_EN_FEMALE_1, VOICE_ES_MALE_1, ...) and this file holds
# only the non-secret slot metadata. Swapping a voice is an .env change.
#
# Four slots: one female and one male, in both English and Spanish.
# All four must be approved by Saman at M1 before generation code is written.

defaultByLanguage:            # FR-6: defaults to the female slot for the output language
  en: en_female_1
  es: es_female_1

slots:
  en_female_1:
    language:   en
    gender:     female
    envVar:     VOICE_EN_FEMALE_1
    label:      "English — female"
  en_male_1:
    language:   en
    gender:     male
    envVar:     VOICE_EN_MALE_1
    label:      "English — male"
  es_female_1:
    language:   es
    gender:     female
    envVar:     VOICE_ES_FEMALE_1
    label:      "Spanish — female"
  es_male_1:
    language:   es
    gender:     male
    envVar:     VOICE_ES_MALE_1
    label:      "Spanish — male"

# Adding a language (§12) is: add slots here, extend the output_language enum,
# add prompt templates and a pronunciation lexicon. No domain or application code.
